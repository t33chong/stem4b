[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stem4b"
version = "0.1.0"
description = "Turn technical PDFs and EPUBs into accessible, chaptered M4B audiobooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
keywords = ["audiobook", "tts", "pdf", "epub", "stem", "m4b"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7,<1",
  "filelock>=3.16,<4",
  "openai>=2,<4",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
stem4b = "stem4b.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stem4b"]

# Keep local books, credentials, workspaces and scratch files out of releases.
[tool.hatch.build.targets.sdist]
include = [
  "/src/stem4b", "/tests", "/docs", "/README.md", "/pyproject.toml",
  "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/CONTRIBUTING.md",
  "/Dockerfile", "/.dockerignore", "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
