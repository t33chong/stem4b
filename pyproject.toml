[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technical-audiobook-generator"
version = "0.1.0"
description = "Turn technical PDFs and EPUBs into accessible, chaptered M4B audiobooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7,<1",
  "filelock>=3.16,<4",
  "openai>=2,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
audiobook = "technical_audiobook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/technical_audiobook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
